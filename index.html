<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : rail des dossiers à gauche, fiche à onglets à droite ; une seule colonne sur mobile */
:root{
  --bg:#eef0ee; --surface:#ffffff; --sunk:#e3e6e3; --line:#cdd2cd; --fg:#1f2523; --muted:#5d6762;
  --accent:#d9661c; --accent-ink:#ffffff; --accent-soft:#f8e3d3;
  --ok:#2f7d4f; --ok-soft:#dcefe2; --warn:#a8790c; --warn-soft:#f6ebc8; --bad:#a83a32; --bad-soft:#f4dcda;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161a19; --surface:#1f2422; --sunk:#262c2a; --line:#38403d; --fg:#e6ebe8; --muted:#9aa5a0;
  --accent:#f08a3e; --accent-ink:#1a1206; --accent-soft:#3d2817;
  --ok:#6cc48f; --ok-soft:#1d3427; --warn:#e0b347; --warn-soft:#3a3016; --bad:#e57a70; --bad-soft:#3d2220;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161a19; --surface:#1f2422; --sunk:#262c2a; --line:#38403d; --fg:#e6ebe8; --muted:#9aa5a0;
  --accent:#f08a3e; --accent-ink:#1a1206; --accent-soft:#3d2817;
  --ok:#6cc48f; --ok-soft:#1d3427; --warn:#e0b347; --warn-soft:#3a3016; --bad:#e57a70; --bad-soft:#3d2220;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100%}
/* ---- rail ---- */
.rail{background:var(--sunk);border-right:1px solid var(--line);padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.brand{font:700 22px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;flex:none;display:grid;place-items:center;font-size:20px;border-radius:8px;background:var(--fg);box-shadow:0 0 0 3px var(--accent-soft)}
.brand{font-size:24px}
.rail-actions{display:flex;gap:8px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:6px}
.pick{display:none}
.item{all:unset;cursor:pointer;display:block;padding:10px 12px;border-radius:var(--r);border:1px solid transparent}
.item:hover{background:var(--surface)}
.item.on{background:var(--surface);border-color:var(--line);box-shadow:inset 3px 0 0 var(--accent)}
.item b{display:block;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.item small{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12.5px;margin-top:3px;flex-wrap:wrap}
.foot{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}

/* ---- boutons ---- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.x{all:unset;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:4px;font-size:18px;line-height:1}
.x:hover{color:var(--bad);background:var(--bad-soft)}

/* ---- zone principale ---- */
main{padding-block:22px 60px;padding-inline:clamp(16px,3vw,36px);min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head .ref{font:500 13px var(--f-mono);color:var(--muted);letter-spacing:.03em}
.head h1{font:700 clamp(26px,3.4vw,36px)/1.05 var(--f-display);margin:4px 0 0;text-wrap:balance;text-transform:uppercase;letter-spacing:.01em}
.head .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--line);margin-bottom:22px}
.tab{all:unset;cursor:pointer;padding:10px 16px 9px;display:flex;align-items:center;gap:10px;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab .n{font:600 13px var(--f-mono);color:var(--muted)}
.tab .t{font:600 17px var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.tab.on{border-color:var(--accent)}
.tab.on .n{color:var(--accent)}
.meter{width:42px;height:5px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--ok)}

.panel{display:flex;flex-direction:column;gap:18px;max-width:1080px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.block > h2{font:600 15px var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 16px}
.grid .wide{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;min-width:0}
label.f > span{font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=number],select,textarea{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:8px 10px;min-width:0}
textarea{min-height:84px;resize:none;overflow:hidden;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* typologie */
.typo{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.chk{position:relative;display:flex;gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;background:var(--bg)}
.chk input{position:absolute;opacity:0;pointer-events:none}
.chk .box{width:20px;height:20px;border:2px solid var(--muted);border-radius:4px;flex:none;display:grid;place-items:center}
.chk .lbl b{display:block;font:600 19px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.chk .lbl small{color:var(--muted);font-size:13px}
.chk:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.chk:has(input:checked) .box{background:var(--accent);border-color:var(--accent)}
.chk:has(input:checked) .box::after{content:"";width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}

/* contacts / tableaux */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.4fr auto;gap:8px;align-items:center}
.row.head-row{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tbl-wrap{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cmp{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px;table-layout:fixed}
.cmp th,.cmp td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:left}
.cmp thead th{background:var(--sunk);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.cmp th.fo,.cmp td.pu{border-left:1px solid var(--line)}
.cmp input,.cmp select{padding:5px 6px;font-size:13px}
.cmp td.pu::before,.cmp td.c-u::before,.cmp td.c-q::before{display:none}
.cmp td.pu input,.cmp .c-q input,.cmp tfoot input{text-align:right}
.cmp td.pu input.best{outline:2px solid var(--ok);outline-offset:-1px;background:var(--ok-soft)}
.fo-head{display:flex;gap:4px;align-items:center}
.fo-sub{display:flex;flex-direction:column;gap:4px;text-transform:none;letter-spacing:0;font-weight:400}
.cmp tfoot td,.cmp tfoot th{background:var(--bg);border-bottom:0}
.cmp tfoot th{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:right}
.tot{font:500 16px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;display:block}
.tot.best{color:var(--ok)}
.tot small{display:block;font:500 11px var(--f-body);color:var(--warn);letter-spacing:.02em}
.lt{font-size:12px;color:var(--muted);font-family:var(--f-mono);text-align:right;display:block}
.retenu{display:flex;justify-content:center;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.retenu input{width:18px;height:18px;accent-color:var(--ok)}
.lot-actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--muted);font-style:italic;padding:6px 0}

/* oui/non */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.seg button{all:unset;cursor:pointer;padding:6px 14px;font-weight:600;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true][data-v=oui]{background:var(--ok);color:var(--surface)}
.seg button[aria-pressed=true][data-v=non]{background:var(--muted);color:var(--surface)}
.seg button[aria-pressed=true][data-v=prevoir]{background:var(--warn);color:var(--surface)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.study{display:flex;flex-direction:column;gap:14px}
.study-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.study-top h3{margin:0;font:700 22px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.study-top p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.detail{border-top:1px dashed var(--line);padding-top:14px}

/* lots */
.lot-total{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;font-size:14px;color:var(--muted)}
.lot-total strong{font:500 18px var(--f-mono);color:var(--fg)}
.recap{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.recap div{padding:10px 12px;border-radius:5px;background:var(--bg);border:1px solid var(--line)}
.recap small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.recap b{font:500 17px var(--f-mono)}

/* pastilles */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-prosp{color:var(--muted)}
.p-etude{background:var(--warn-soft);color:var(--warn)}
.p-offre{background:var(--accent-soft);color:var(--accent)}
.p-attrib,.p-travaux{background:var(--ok-soft);color:var(--ok)}
.p-recep{background:var(--sunk);color:var(--fg)}
.p-perdu{background:var(--bad-soft);color:var(--bad)}
.tag{font:500 11px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);padding:1px 6px;border-radius:3px;color:var(--muted)}
.tag.ex{border-color:var(--warn);color:var(--warn)}

.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:var(--r);font-weight:500;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}


/* ---- synthèse (feuille A4) ---- */
.synth-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;max-width:210mm}
.synth-bar label{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.synth-bar input{width:17px;height:17px;accent-color:var(--accent)}
.sheet{--ink:#1c2220;--soft:#5b6460;--rule:#c9cfcb;--fill:#f1f3f1;--hi:#d9661c;
  background:#fff;color:var(--ink);width:100%;max-width:210mm;padding:14mm 13mm;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.08);font-size:10.5pt;line-height:1.4;color-scheme:light}
.sheet h1{font:700 22pt/1.05 var(--f-display);text-transform:uppercase;margin:0;text-wrap:balance}
.sheet h2{font:600 11pt var(--f-display);text-transform:uppercase;letter-spacing:.1em;color:var(--hi);margin:0 0 6px;padding-bottom:3px;border-bottom:1.5px solid var(--hi)}
.sheet h3{font:600 10.5pt var(--f-display);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 4px}
.sheet section{margin-top:16px}
.sh-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:3px solid var(--ink);padding-bottom:10px}
.sh-top .ref{font:500 9pt var(--f-mono);color:var(--soft);letter-spacing:.04em}
.sh-top .ed{text-align:right;font-size:9pt;color:var(--soft);white-space:nowrap}
.sh-top .ed b{display:block;font:600 10pt var(--f-body);color:var(--ink)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}
.kv div{display:flex;gap:8px;padding:3px 0;border-bottom:1px dotted var(--rule);min-width:0}
.kv dt{flex:0 0 38%;color:var(--soft);font-size:9pt;text-transform:uppercase;letter-spacing:.04em;padding-top:1px}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.typo-p{display:flex;gap:18px;margin-top:8px;font-weight:600}
.typo-p span{display:flex;gap:6px;align-items:center}
.typo-p i{width:12px;height:12px;border:1.5px solid var(--ink);display:inline-grid;place-items:center;font-style:normal;font-size:9pt;line-height:1}
.st{width:100%;border-collapse:collapse;font-size:9.5pt;table-layout:fixed}
.st td,.st th{overflow-wrap:anywhere}
.st th,.st td{border:1px solid var(--rule);padding:4px 6px;text-align:left;vertical-align:top}
.st thead th{background:var(--fill);font-size:8.5pt;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);font-weight:600}
.st .r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.st .ret{background:#e3f1e8;font-weight:600}
.st tfoot td,.st tfoot th{background:var(--fill);font-weight:600}
.st .bp{text-decoration:underline;text-decoration-color:#2f7d4f;text-decoration-thickness:2px}
.chip{display:inline-block;font-size:8.5pt;font-weight:600;padding:0 6px;border:1px solid currentColor;border-radius:3px;white-space:nowrap}
.c-oui{color:#2f7d4f}.c-non{color:#5b6460}.c-prevoir{color:#9a6c00}.c-vide{color:#a83a32}
.note{white-space:pre-wrap;margin:4px 0 0;font-size:9.5pt}
.total-band{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding:6px 10px;border:1.5px solid var(--ink)}
.total-band b{font:600 13pt var(--f-mono)}
.sh-foot{margin-top:18px;padding-top:6px;border-top:1px solid var(--rule);font-size:8.5pt;color:var(--soft);display:flex;justify-content:space-between}
.sh-wrap{overflow-x:auto}

@media print{
  @page{size:A4;margin:10mm}
  html,body{background:#fff!important;height:auto}
  .rail,.tabs,.head,.synth-bar,.toast{display:none!important}
  .app{display:block}
  main{padding:0}
  .panel{max-width:none}
  .sheet{box-shadow:none;padding:0;max-width:none;border-radius:0}
  .sheet section{break-inside:avoid}
  .sheet section.long{break-inside:auto}
  .st thead{display:table-header-group}
  .st tr{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{border-right:0;border-bottom:1px solid var(--line);gap:10px}
  .list{display:none}
  .pick{display:block;width:100%;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-weight:600}
  .tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:0;gap:6px}
  .tab{border:1px solid var(--line);border-radius:var(--r);margin:0;padding:8px 10px;background:var(--surface)}
  .tab.on{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
  .tab .t{font-size:15px;white-space:normal}
  .tab .meter{margin-left:auto}
  .kv{grid-template-columns:1fr}
  .row{grid-template-columns:1fr 1fr auto}
  .row.head-row{display:none}
}
@media (max-width:760px){
  /* tableau comparatif en cartes empilées */
  .tbl-wrap{border:0;overflow:visible}
  .cmp,.cmp tbody,.cmp tfoot{display:block}
  .cmp colgroup{display:none}
  .cmp thead{display:block}
  .cmp thead tr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
  .cmp thead th{background:none;padding:0;border:0}
  .cmp thead th.c-des,.cmp thead th.c-u,.cmp thead th.c-q,.cmp thead th.c-x{display:none}
  .cmp thead th.fo{border:1px solid var(--line);border-radius:var(--r);padding:8px;background:var(--sunk)}
  .cmp tr{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative;padding:10px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
  .cmp td,.cmp th{display:block;border:0!important;padding:0}
  .cmp td.c-des{grid-column:1/-1;padding-right:36px}
  .cmp td.c-x{position:absolute;top:10px;right:6px;width:auto}
  .cmp td.pu::before,.cmp td.c-u::before,.cmp td.c-q::before{display:block;content:attr(data-pre) attr(data-lab);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cmp td.empty{grid-column:1/-1}
  .cmp tfoot tr{background:var(--bg)}
  .cmp tfoot th{display:none}
  .cmp tfoot td.pu::before{content:attr(data-lab)}
  .cmp tfoot tr.ret-row td.pu::before{display:none}
  .tot{text-align:left}
  .retenu{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<div class="app">
  <aside class="rail">
    <div class="brand"><span class="logo" aria-hidden="true">💡</span>Etudotronic</div>
    <div class="rail-actions"><button class="btn primary" id="btn-new">+ Nouveau dossier</button></div>
    <select class="pick" id="pick" aria-label="Choisir un dossier"></select>
    <div class="list" id="list"></div>
    <div class="foot">
      <button class="btn sm ghost" id="btn-export">Exporter JSON</button>
      <label class="btn sm ghost" for="file-import" style="cursor:pointer">Importer JSON</label>
      <input type="file" id="file-import" accept=".json,application/json" hidden>
      <button class="btn sm primary" id="btn-install" hidden>Installer l’appli</button>
    </div>
  </aside>

  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
const KEY = 'dossiersTP.v1';
const ETATS = [
  ['prosp','Prospection'],['etude','Étude en cours'],['offre','Offre remise'],
  ['attrib','Attribué'],['travaux','En travaux'],['recep','Réceptionné'],['perdu','Perdu / abandonné']
];
const ETUDES = {
  sol:{t:'Étude de sol',d:'Géotechnique : nature des terrains, portance, présence d’eau, réemploi des matériaux.',missions:['G1 ES','G1 PGC','G2 AVP','G2 PRO','G3','G4','G5','Autre']},
  pollution:{t:'Étude pollution',d:'Diagnostic sols / amiante / HAP : filières d’évacuation et surcoûts de traitement.',missions:['Diag. amiante avant démolition','Diag. HAP enrobés','Diag. sols (A200)','Plan de gestion','Autre']},
  hydro:{t:'Étude hydro',d:'Hydraulique / hydrogéologie : perméabilité, gestion des eaux pluviales, nappe.',missions:['Test de perméabilité','Note hydraulique EP','Étude hydrogéologique','Dossier loi sur l’eau','Autre']}
};
const LOTS = {
  reseaux:{t:'Tuyaux & réseaux VRD',d:'Canalisations, regards, avaloirs, fourreaux, chambres de tirage…'},
  eclairage:{t:'Éclairage',d:'Candélabres, luminaires, massifs, câbles, armoire de commande…'},
  clotures:{t:'Clôtures',d:'Panneaux rigides, portails, portillons, poteaux, soubassements…'},
  verts:{t:'Espaces verts',d:'Terre végétale, plantations, engazonnement, arrosage, mobilier…'}
};
const STATUTS_DEV = [['demande','Demandé'],['relance','Relancé'],['recu','Reçu'],['decline','Décliné']];

const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur = n => (isFinite(n)&&n!=='' && n!==null) ? Number(n).toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}) : '—';

function blank(){
  const etudes={}; Object.keys(ETUDES).forEach(k=>etudes[k]={statut:'',bureau:'',date:'',mission:'',texte:''});
  const lots={}; Object.keys(LOTS).forEach(k=>lots[k]={concerne:'',produits:[],offres:[],notes:''});
  return {id:uid(),exemple:false,nom:'Nouveau dossier',numero:'',adresse:'',cp:'',commune:'',
    client:{nom:'',type:'',moe:''},contacts:[],etat:'prosp',dateRemise:'',
    typologie:{demolition:false,terrassement:false,vrd:false},notes:'',etudes,lots,updated:Date.now()};
}
function sample(){
  const d=blank();
  Object.assign(d,{exemple:true,nom:'Lotissement Les Sagnières — viabilisation',numero:'AFF-2026-041',
    adresse:'Chemin des Sagnières',cp:'05000',commune:'Gap',etat:'etude',dateRemise:'2026-10-23',
    client:{nom:'SCI Les Sagnières',type:'prive',moe:'Cabinet Alpes Ingénierie'},
    typologie:{demolition:true,terrassement:true,vrd:true},
    notes:'12 lots. Démolition d’un hangar agricole existant (≈ 350 m²). Accès chantier par le chemin communal, tonnage limité.'});
  d.contacts=[{nom:'M. Garnier',role:'Gérant SCI',tel:'06 12 34 56 78',mail:'contact@exemple.fr'},
              {nom:'Mme Rossi',role:'MOE — chef de projet',tel:'04 92 00 00 00',mail:'moe@exemple.fr'}];
  d.etudes.sol={statut:'oui',bureau:'Géotec (exemple)',date:'2026-06-12',mission:'G2 AVP',texte:'Limons argileux sur 1,20 m puis graves. Arase en PST2 après purge partielle. Venues d’eau à 2,50 m en sondage SP3 (fond de lot 9).'};
  d.etudes.pollution={statut:'prevoir',bureau:'',date:'',mission:'Diag. amiante avant démolition',texte:'Toiture du hangar en fibrociment probable, diagnostic à demander au MOA.'};
  d.etudes.hydro={statut:'non',bureau:'',date:'',mission:'',texte:''};
  const P=(designation,unite,qte)=>({id:uid(),designation,unite,qte:String(qte)});
  const O=(fournisseur,date,statut,prods,pus,retenu=false)=>{const pu={};prods.forEach((p,i)=>{if(pus[i]!=null)pu[p.id]=String(pus[i]);});return {id:uid(),fournisseur,date,statut,retenu,pu,montant:''};};
  let pr=[P('Tuyau PVC CR8 Ø200','ml',420),P('Tuyau PP SN8 Ø300','ml',260),P('Tuyau PP SN8 Ø400','ml',85),P('Regard béton Ø1000','U',14),P('Tampon fonte D400','U',14),P('Avaloir grille 500×500','U',6)];
  d.lots.reseaux={concerne:'oui',notes:'EU en PVC, EP en PP. Livraison par semi sur le chemin communal à confirmer.',produits:pr,offres:[
    O('Fournisseur A','2026-10-01','recu',pr,[24,41,68,690,165,310]),
    O('Fournisseur B','2026-10-01','recu',pr,[22.5,43,64,655,158,295],true),
    O('Fournisseur C','2026-10-02','relance',pr,[])]};
  pr=[P('Candélabre acier galva 5 m','U',8),P('Luminaire LED 30 W','U',8),P('Câble U1000 R2V 4×16','ml',260),P('Armoire de commande','U',1)];
  d.lots.eclairage={concerne:'oui',notes:'',produits:pr,offres:[O('Fournisseur D','2026-10-05','demande',pr,[])]};
  d.lots.clotures={concerne:'non',notes:'',produits:[],offres:[]};
  pr=[P('Terre végétale','m³',180),P('Semences gazon rustique','kg',25)];
  d.lots.verts={concerne:'oui',notes:'Terre végétale 30 cm sur noues.',produits:pr,offres:[O('Pépinière E','2026-10-03','recu',pr,[28,9])]};
  return d;
}
function normalize(d){
  const b=blank();
  d.client=Object.assign(b.client,d.client||{});d.typologie=Object.assign(b.typologie,d.typologie||{});
  d.contacts=d.contacts||[];
  d.etudes=Object.assign(b.etudes,d.etudes||{});
  Object.keys(LOTS).forEach(k=>{const l=Object.assign({concerne:'',offres:[],notes:''},(d.lots||{})[k]||{});
    l.produits=l.produits||[];l.offres.forEach(o=>{o.id=o.id||uid();o.pu=o.pu||{};if(o.montant==null)o.montant='';});
    (d.lots=d.lots||{})[k]=l;});
  return d;
}

let state;
function load(){
  try{const r=localStorage.getItem(KEY); if(r){const s=JSON.parse(r); if(s&&Array.isArray(s.dossiers)&&s.dossiers.length){s.dossiers.forEach(normalize);return s;}}}catch(e){}
  const s=sample(); return {dossiers:[s],current:s.id,tab:'denom',synthDetail:true};
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){} }
state=load();
const cur=()=>state.dossiers.find(d=>d.id===state.current)||state.dossiers[0];

/* chemins */
function getP(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o);}
function setP(o,p,v){const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++)a=a[ks[i]];a[ks.at(-1)]=v;}

/* progression */
function progress(d){
  const f1=[d.nom&&d.nom!=='Nouveau dossier',d.adresse,d.commune,d.client.nom,d.contacts.length>0,d.etat,
    d.typologie.demolition||d.typologie.terrassement||d.typologie.vrd];
  const f2=Object.values(d.etudes).map(e=>!!e.statut && (e.statut!=='oui' || !!e.texte));
  const f3=Object.values(d.lots).map(l=>!!l.concerne && (l.concerne!=='oui' || l.offres.some(o=>o.statut==='recu')));
  const r=a=>a.filter(Boolean).length/a.length;
  return {denom:r(f1),etudes:r(f2),prix:r(f3)};
}
const etatPill = k => {const e=ETATS.find(x=>x[0]===k)||ETATS[0];return `<span class="pill p-${e[0]}">${e[1]}</span>`;};

/* ---- rendu liste ---- */
function renderList(){
  const P=document.getElementById('pick');
  P.innerHTML=[...state.dossiers].sort((a,b)=>b.updated-a.updated).map(d=>`<option value="${d.id}" ${d.id===state.current?'selected':''}>${esc(d.nom||'Sans nom')}${d.commune?' — '+esc(d.commune):''}</option>`).join('');
  const L=document.getElementById('list');
  L.innerHTML=[...state.dossiers].sort((a,b)=>b.updated-a.updated).map(d=>{
    const typ=['demolition','terrassement','vrd'].filter(k=>d.typologie[k]).map(k=>({demolition:'DÉMO',terrassement:'TERR',vrd:'VRD'}[k])).join(' · ');
    return `<button class="item ${d.id===state.current?'on':''}" data-id="${d.id}">
      <b>${esc(d.nom||'Sans nom')}</b>
      <small>${etatPill(d.etat)}${d.exemple?'<span class="tag ex">Exemple</span>':''}${typ?`<span class="tag">${typ}</span>`:''}</small>
      ${d.commune?`<small>${esc(d.commune)}</small>`:''}
    </button>`;}).join('');
}

/* ---- composants ---- */
const field=(label,path,val,type='text',extra='')=>`<label class="f${/class="wide"/.test(extra)?' wide':''}"><span>${label}</span><input type="${type}" id="f-${path}" data-k="${path}" value="${esc(val)}" ${extra}></label>`;
const area=(label,path,val,ph='')=>`<label class="f wide"><span>${label}</span><textarea id="f-${path}" data-k="${path}" placeholder="${esc(ph)}">${esc(val)}</textarea></label>`;
const select=(label,path,val,opts)=>`<label class="f"><span>${label}</span><select id="f-${path}" data-k="${path}">${opts.map(([v,t])=>`<option value="${v}" ${v===val?'selected':''}>${t}</option>`).join('')}</select></label>`;
const seg=(path,val,choices)=>`<div class="seg" role="group">${choices.map(([v,t])=>`<button type="button" data-seg="${path}" data-v="${v}" aria-pressed="${val===v}">${t}</button>`).join('')}</div>`;

function tabDenom(d){
  return `
  <section class="block"><h2>Identification</h2>
    <div class="grid">
      ${field('Intitulé du dossier','nom',d.nom,'text','class="wide"')}
      ${field('N° d’affaire','numero',d.numero)}
      ${select('État du dossier','etat',d.etat,ETATS)}
      ${field('Date de remise d’offre','dateRemise',d.dateRemise,'date')}
    </div>
  </section>
  <section class="block"><h2>Localisation</h2>
    <div class="grid">

const UNITES=['ml','m²','m³','U','kg','t','ens','ft'];
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null;};
function offerTotal(l,o){
  if(!l.produits.length) return {total:num(o.montant),complet:true};
  let t=0,any=false,complet=true;
  l.produits.forEach(p=>{const pu=num(o.pu[p.id]),q=num(p.qte);if(pu!=null){any=true;t+=pu*(q||0);}else complet=false;});
  return {total:any?t:null,complet};
}
function lotStats(l){
  const tots=l.offres.map(o=>({o,...offerTotal(l,o)}));
  const recus=tots.filter(x=>x.o.statut==='recu'&&x.total!=null);
  const min=recus.length?Math.min(...recus.map(x=>x.total)):null;
  const r=tots.find(x=>x.o.retenu);
  return {nb:l.offres.length,recus:recus.length,min,ret:r&&r.total!=null?r.total:null,tots};
}
function bestPU(l,p){
  const v=l.offres.filter(o=>o.statut!=='decline').map(o=>num(o.pu[p.id])).filter(x=>x!=null);
  return v.length>1?Math.min(...v):null;
}
function lotTable(k,l){
  const p=`lots.${k}`; const st=lotStats(l); const hasP=l.produits.length>0;
  if(!l.offres.length&&!hasP) return '<div class="empty">Ajoutez les produits à chiffrer, puis les fournisseurs consultés.</div>';
  const fo=l.offres.map((o,i)=>`<th class="fo"><div class="fo-sub">
      <div class="fo-head"><input type="text" id="o-${o.id}-f" data-k="${p}.offres.${i}.fournisseur" value="${esc(o.fournisseur)}" placeholder="Fournisseur" aria-label="Fournisseur"><button class="x" data-act="del-offre" data-lot="${k}" data-i="${i}" title="Retirer ce fournisseur">×</button></div>
      <input type="date" id="o-${o.id}-d" data-k="${p}.offres.${i}.date" value="${esc(o.date)}" aria-label="Date de demande">
      <select id="o-${o.id}-s" data-k="${p}.offres.${i}.statut" aria-label="Statut">${STATUTS_DEV.map(([v,t])=>`<option value="${v}" ${v===o.statut?'selected':''}>${t}</option>`).join('')}</select>
    </div></th>`).join('');
  const rows=l.produits.map((pr,j)=>{const b=bestPU(l,pr);return `<tr>
      <td class="c-des"><input type="text" id="p-${pr.id}-d" data-k="${p}.produits.${j}.designation" value="${esc(pr.designation)}" placeholder="Désignation (ex. Tuyau PVC CR8 Ø200)" aria-label="Désignation"></td>
      <td class="c-u" data-lab="Unité"><select id="p-${pr.id}-u" data-k="${p}.produits.${j}.unite" aria-label="Unité">${UNITES.map(u=>`<option ${u===pr.unite?'selected':''}>${u}</option>`).join('')}</select></td>
      <td class="c-q" data-lab="Quantité"><input type="text" inputmode="decimal" id="p-${pr.id}-q" data-k="${p}.produits.${j}.qte" value="${esc(pr.qte)}" class="num" placeholder="0" aria-label="Quantité"></td>
      ${l.offres.map((o,oi)=>{const v=num(o.pu[pr.id]);return `<td class="pu" data-of="${o.id}" data-pre="PU · " data-lab="${esc(o.fournisseur||'Fournisseur '+(oi+1))}"><input type="text" inputmode="decimal" id="pu-${o.id}-${pr.id}" data-k="${p}.offres.${l.offres.indexOf(o)}.pu.${pr.id}" data-pu="${k}|${pr.id}" value="${esc(o.pu[pr.id]??'')}" class="num ${b!=null&&v===b?'best':''}" placeholder="PU € HT" aria-label="Prix unitaire ${esc(o.fournisseur)}"></td>`;}).join('')}
      <td class="c-x"><button class="x" data-act="del-produit" data-lot="${k}" data-i="${j}" title="Supprimer ce produit">×</button></td>
    </tr>`;}).join('');
  const totCells=st.tots.map((x,i)=>hasP
    ?`<td class="pu" data-of="${x.o.id}" data-lab="Total · ${esc(x.o.fournisseur||'Fournisseur '+(i+1))}"><span class="tot ${st.min!=null&&x.o.statut==='recu'&&x.total===st.min?'best':''}" data-tot="${x.o.id}">${eur(x.total)}${x.total!=null&&!x.complet?'<small>incomplet</small>':''}</span></td>`
    :`<td class="pu" data-of="${x.o.id}" data-lab="Montant · ${esc(x.o.fournisseur||'Fournisseur '+(i+1))}"><input type="text" inputmode="decimal" id="o-${x.o.id}-m" data-k="${p}.offres.${i}.montant" value="${esc(x.o.montant)}" class="num" placeholder="Montant € HT" aria-label="Montant global"></td>`).join('');
  const retCells=l.offres.map((o,i)=>`<td class="pu" data-lab=""><label class="retenu"><input type="radio" name="ret-${k}" id="o-${o.id}-r" data-ret="${k}" data-i="${i}" ${o.retenu?'checked':''}>Retenu</label></td>`).join('');
  return `<div class="tbl-wrap"><table class="cmp">
    <colgroup><col style="width:${l.offres.length>3?28:34}%"><col style="width:70px"><col style="width:84px">${l.offres.map(()=>'<col>').join('')}<col style="width:34px"></colgroup>
    <thead><tr><th class="c-des">Produit</th><th class="c-u">Unité</th><th class="c-q" style="text-align:right">Quantité</th>${fo}<th class="c-x"></th></tr></thead>
    <tbody>${rows||`<tr><td colspan="${4+l.offres.length}" class="empty">Aucun produit : le prix se saisit en montant global par fournisseur.</td></tr>`}</tbody>
    ${l.offres.length?`<tfoot><tr><th colspan="3">${hasP?'Total HT (Σ qté × PU)':'Montant global HT'}</th>${totCells}<td></td></tr>
      <tr class="ret-row"><th colspan="3"></th>${retCells}<td></td></tr></tfoot>`:''}
  </table></div>`;
}
function tabPrix(d){
  let totRet=0;
  const blocks=Object.entries(LOTS).map(([k,L])=>{
    const l=d.lots[k]; const p=`lots.${k}`; const st=lotStats(l);
    if(l.concerne==='oui'&&st.ret!=null) totRet+=st.ret;
    return `<section class="block study">
      <div class="study-top"><div><h3>${L.t}</h3><p>${L.d}</p></div>
        ${seg(p+'.concerne',l.concerne,[['oui','Concerné'],['non','Non concerné']])}</div>
      ${l.concerne==='oui'?`<div class="detail" style="display:flex;flex-direction:column;gap:12px">
        ${lotTable(k,l)}
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
          <div class="lot-actions"><button class="btn sm" data-act="add-produit" data-lot="${k}">+ Produit</button><button class="btn sm" data-act="add-offre" data-lot="${k}">+ Fournisseur</button></div>
          <div class="lot-total" data-sum="${k}">${lotSum(st)}</div>
        </div>
        <div class="grid">${area('Notes',p+'.notes',l.notes,'Conditions de livraison, délais, variantes proposées…')}</div>
      </div>`:''}
    </section>`;});
  return `<section class="block"><h2>Récapitulatif fournitures &amp; sous-traitance</h2>
    <div class="recap" id="recap">${recapHTML(d)}</div></section>`+blocks.join('');
}
function lotSum(st){return `<span>${st.recus}/${st.nb} offre${st.nb>1?'s':''} reçue${st.recus>1?'s':''}</span><span>Moins-disant <strong>${eur(st.min)}</strong></span><span>Retenu <strong>${eur(st.ret)}</strong></span>`;}
function recapHTML(d){
  let tot=0;
  return Object.entries(LOTS).map(([k,L])=>{const l=d.lots[k];const st=lotStats(l);const v=st.ret!=null?st.ret:st.min;
    if(l.concerne==='oui'&&st.ret!=null) tot+=st.ret;
    return `<div><small>${L.t}</small><b>${l.concerne==='oui'?eur(v):l.concerne==='non'?'Non concerné':'—'}</b></div>`;}).join('')
    +`<div style="border-color:var(--accent)"><small>Total retenu HT</small><b>${eur(tot||null)}</b></div>`;
}
/* mise à jour sur place pendant la saisie (garde le focus) */
function updatePrix(){
  const d=cur(); if(state.tab!=='prix') return;
  Object.entries(d.lots).forEach(([k,l])=>{
    if(l.concerne!=='oui') return; const st=lotStats(l);
    st.tots.forEach(x=>{const el=document.querySelector(`[data-tot="${x.o.id}"]`);if(el){el.innerHTML=eur(x.total)+(x.total!=null&&!x.complet?'<small>incomplet</small>':'');el.classList.toggle('best',st.min!=null&&x.o.statut==='recu'&&x.total===st.min);}});
    l.produits.forEach(pr=>{const b=bestPU(l,pr);l.offres.forEach(o=>{const el=document.getElementById(`pu-${o.id}-${pr.id}`);if(el)el.classList.toggle('best',b!=null&&num(o.pu[pr.id])===b);});});
    const s=document.querySelector(`[data-sum="${k}"]`); if(s) s.innerHTML=lotSum(st);
  });
  const r=document.getElementById('recap'); if(r) r.innerHTML=recapHTML(d);
}

const fmtD=v=>v?new Date(v+'T00:00:00').toLocaleDateString('fr-FR'):'—';
const ETU_LBL={oui:['Réalisée','oui'],non:['Non','non'],prevoir:['À prévoir','prevoir'],'':['Non renseigné','vide']};
function tabSynth(d){
  const etat=(ETATS.find(x=>x[0]===d.etat)||ETATS[0])[1];
  const typeCli={public:'Public',prive:'Privé',bailleur:'Bailleur social',entreprise:'Entreprise générale'}[d.client.type]||'—';
  const kv=(k,v)=>`<div><dt>${k}</dt><dd>${esc(v)||'—'}</dd></div>`;
  const adr=[d.adresse,[d.cp,d.commune].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  let totRet=0;
  const lotsRows=Object.entries(LOTS).map(([k,L])=>{const l=d.lots[k];const st=lotStats(l);
    const r=st.tots.find(x=>x.o.retenu);
    if(l.concerne==='oui'&&st.ret!=null) totRet+=st.ret;
    if(l.concerne!=='oui') return `<tr><td>${L.t}</td><td colspan="4">${l.concerne==='non'?'Non concerné':'Non renseigné'}</td></tr>`;
    return `<tr><td>${L.t}</td><td class="r">${st.recus} / ${st.nb}</td><td class="r">${eur(st.min)}</td><td>${r?esc(r.o.fournisseur||'—'):'—'}</td><td class="r">${eur(st.ret)}</td></tr>`;}).join('');
  const detail=!state.synthDetail?'':Object.entries(LOTS).map(([k,L])=>{const l=d.lots[k];
    if(l.concerne!=='oui'||(!l.offres.length&&!l.produits.length)) return '';
    const st=lotStats(l); const of=l.offres;
    let t;
    if(l.produits.length){
      t=`<table class="st"><thead><tr><th>Produit</th><th>U</th><th class="r">Qté</th>${of.map(o=>`<th class="r ${o.retenu?'ret':''}">${esc(o.fournisseur||'—')}<br><span style="font-weight:400;text-transform:none">${(STATUTS_DEV.find(x=>x[0]===o.statut)||['',''])[1]}</span></th>`).join('')}</tr></thead>
      <tbody>${l.produits.map(p=>{const b=bestPU(l,p);return `<tr><td>${esc(p.designation)||'—'}</td><td>${esc(p.unite)}</td><td class="r">${esc(p.qte)||'—'}</td>${of.map(o=>{const v=num(o.pu[p.id]);return `<td class="r ${o.retenu?'ret':''} ${b!=null&&v===b?'bp':''}">${v!=null?v.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}):'—'}</td>`;}).join('')}</tr>`;}).join('')}</tbody>
      <tfoot><tr><th colspan="3" style="text-align:right">Total HT</th>${st.tots.map(x=>`<td class="r ${x.o.retenu?'ret':''}">${eur(x.total)}${x.total!=null&&!x.complet?' *':''}</td>`).join('')}</tr></tfoot></table>`;
    } else {
      t=`<table class="st"><thead><tr><th>Fournisseur</th><th>Date demande</th><th>Statut</th><th class="r">Montant HT</th></tr></thead><tbody>${st.tots.map(x=>`<tr class="${x.o.retenu?'ret':''}"><td>${esc(x.o.fournisseur)||'—'}</td><td>${fmtD(x.o.date)}</td><td>${(STATUTS_DEV.find(y=>y[0]===x.o.statut)||['',''])[1]}</td><td class="r">${eur(x.total)}</td></tr>`).join('')}</tbody></table>`;
    }
    return `<h3>${L.t}</h3><div class="sh-wrap">${t}</div>${l.notes?`<p class="note">${esc(l.notes)}</p>`:''}`;}).join('');
  const now=new Date();
  return `<div class="synth-bar">
      <label><input type="checkbox" id="synth-detail" ${state.synthDetail?'checked':''}> Inclure le détail des prix par produit</label>
      <button class="btn primary" data-act="print">Imprimer / enregistrer en PDF</button>
    </div>
    <article class="sheet">
      <header class="sh-top">
        <div><div class="ref">${esc(d.numero||'Sans n° d’affaire')}</div><h1>${esc(d.nom||'Sans nom')}</h1></div>
        <div class="ed"><b>Fiche de synthèse</b>Éditée le ${now.toLocaleDateString('fr-FR')}</div>
      </header>
      <section><h2>Dénomination</h2>
        <dl class="kv" style="margin:0">${kv('État',etat)}${kv('Remise d’offre',d.dateRemise?fmtD(d.dateRemise):'')}${kv('Adresse',adr)}${kv('Client',d.client.nom)}${kv('Type de client',typeCli==='—'?'':typeCli)}${kv('Maître d’œuvre',d.client.moe)}</dl>
        <div class="typo-p">${[['demolition','Démolition'],['terrassement','Terrassement'],['vrd','VRD']].map(([k,t])=>`<span><i>${d.typologie[k]?'✕':''}</i>${t}</span>`).join('')}</div>
        ${d.notes?`<p class="note">${esc(d.notes)}</p>`:''}
        ${d.contacts.length?`<h3>Contacts</h3><table class="st"><thead><tr><th>Nom</th><th>Rôle</th><th>Téléphone</th><th>E-mail</th></tr></thead><tbody>${d.contacts.map(c=>`<tr><td>${esc(c.nom)||'—'}</td><td>${esc(c.role)||'—'}</td><td style="white-space:nowrap">${esc(c.tel)||'—'}</td><td style="overflow-wrap:anywhere">${esc(c.mail)||'—'}</td></tr>`).join('')}</tbody></table>`:''}
      </section>
      <section><h2>Études préliminaires</h2>
        <table class="st"><thead><tr><th style="width:18%">Étude</th><th style="width:13%">Statut</th><th style="width:25%">Bureau · mission · date</th><th>À retenir</th></tr></thead><tbody>
        ${Object.entries(ETUDES).map(([k,E])=>{const e=d.etudes[k];const [lb,c]=ETU_LBL[e.statut||''];
          const info=e.statut==='oui'?[e.bureau,e.mission,e.date?fmtD(e.date):''].filter(Boolean).map(esc).join('<br>'):e.statut==='prevoir'?esc(e.mission):'';
          return `<tr><td><b>${E.t}</b></td><td><span class="chip c-${c}">${lb}</span></td><td>${info||'—'}</td><td style="white-space:pre-wrap">${(e.statut==='oui'||e.statut==='prevoir')&&e.texte?esc(e.texte):'—'}</td></tr>`;}).join('')}
        </tbody></table>
      </section>
      <section class="long"><h2>Consultation des prix</h2>
        <table class="st"><thead><tr><th>Lot</th><th class="r">Reçues / consultés</th><th class="r">Moins-disant</th><th>Fournisseur retenu</th><th class="r">Retenu HT</th></tr></thead><tbody>${lotsRows}</tbody></table>
        <div class="total-band"><span>Total fournitures &amp; sous-traitance retenues</span><b>${eur(totRet||null)} HT</b></div>
        ${detail}
        ${state.synthDetail?'<p style="font-size:8.5pt;color:var(--soft);margin-top:6px">Colonne surlignée : offre retenue · PU souligné : meilleur prix de la ligne · * : offre incomplète</p>':''}
      </section>
      <footer class="sh-foot"><span>${esc(d.nom||'')}</span><span>${esc(d.numero||'')}</span></footer>
    </article>`;
}

    <div class="head">
      <div><div class="ref">${esc(d.numero||'Sans n° d’affaire')}${d.commune?' · '+esc(d.commune):''}</div><h1>${esc(d.nom||'Sans nom')}</h1></div>
      <div class="meta">${etatPill(d.etat)}${d.exemple?'<span class="tag ex">Dossier exemple</span>':''}
        ${pendingDelete?`<span class="confirm">Supprimer ce dossier ? <button class="btn sm danger" data-act="del-yes">Supprimer</button><button class="btn sm" data-act="del-no">Annuler</button></span>`
          :`<button class="btn sm" data-act="print">Imprimer la synthèse</button><button class="btn sm ghost" data-act="dup">Dupliquer</button><button class="btn sm ghost danger" data-act="del">Supprimer</button>`}
      </div>

    <nav class="tabs" role="tablist">${tabs.map(([k,n,t])=>`<button class="tab ${state.tab===k?'on':''}" role="tab" aria-selected="${state.tab===k}" data-tab="${k}">
      <span class="n">${n}</span><span class="t">${t}</span>${pr[k]!=null?`<span class="meter" title="${Math.round(pr[k]*100)} % renseigné"><span style="width:${pr[k]*100}%"></span></span>`:''}</button>`).join('')}</nav>
    <div class="panel">${body}</div>`;
  document.querySelectorAll('#main textarea').forEach(autosize);
}
function autosize(t){t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px';}
function render(){renderList();renderMain();}

/* ---- refresh partiel (sans perdre le focus) ---- */
function refreshMeta(){
  const d=cur(), pr=progress(d);
  document.querySelectorAll('.tab').forEach(t=>{const s=t.querySelector('.meter span');if(s)s.style.width=pr[t.dataset.tab]*100+'%';});

main.addEventListener('input',e=>{
  const k=e.target.dataset.k; if(!k) return;
  const d=cur(); const v=e.target.type==='checkbox'?e.target.checked:e.target.value;
  setP(d,k,v); d.exemple=false; d.updated=Date.now(); save();
  if(e.target.tagName==='TEXTAREA') autosize(e.target);
  if(/\.(qte|montant)$|\.pu\./.test(k)){ updatePrix(); refreshMeta(); return; }
  if(/offres\.\d+\.fournisseur$/.test(k)){ const oid=e.target.id.slice(2,-2); const name=v||'Fournisseur';
    document.querySelectorAll(`[data-of="${oid}"]`).forEach(td=>{const pre=(td.dataset.lab.match(/^(Total|Montant) · /)||[''])[0];td.dataset.lab=pre+name;}); }
  if(e.target.tagName==='SELECT'||e.target.type==='checkbox'){
    const id=e.target.id; renderMain(); renderList(); const el=document.getElementById(id); if(el&&el.tagName!=='SELECT') el.focus();
  } else refreshMeta();
});
main.addEventListener('change',e=>{
  if(e.target.id==='synth-detail'){state.synthDetail=e.target.checked;save();renderMain();return;}
  if(e.target.dataset.ret){const d=cur();const l=d.lots[e.target.dataset.ret];l.offres.forEach((o,i)=>o.retenu=i===+e.target.dataset.i);d.updated=Date.now();save();renderMain();}
});
main.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; const d=cur();
  if(b.dataset.tab){state.tab=b.dataset.tab;save();renderMain();return;}
  if(b.dataset.seg){const cv=getP(d,b.dataset.seg);setP(d,b.dataset.seg,cv===b.dataset.v?'':b.dataset.v);d.exemple=false;d.updated=Date.now();save();render();return;}
  const a=b.dataset.act; if(!a) return;
  if(a==='print'){ if(state.tab!=='synth'){state.tab='synth';save();renderMain();} setTimeout(()=>{try{window.print();}catch(err){}},60); return; }
  if(a==='add-contact'){d.contacts.push({nom:'',role:'',tel:'',mail:''});}
  else if(a==='del-contact'){d.contacts.splice(+b.dataset.i,1);}
  else if(a==='add-offre'){d.lots[b.dataset.lot].offres.push({id:uid(),fournisseur:'',date:new Date().toISOString().slice(0,10),statut:'demande',montant:'',pu:{},retenu:false});}
  else if(a==='del-offre'){d.lots[b.dataset.lot].offres.splice(+b.dataset.i,1);}
  else if(a==='add-produit'){d.lots[b.dataset.lot].produits.push({id:uid(),designation:'',unite:'ml',qte:''});}
  else if(a==='del-produit'){const l=d.lots[b.dataset.lot];const [pr]=l.produits.splice(+b.dataset.i,1);l.offres.forEach(o=>delete o.pu[pr.id]);}
  else if(a==='dup'){const c=JSON.parse(JSON.stringify(d));c.id=uid();c.nom=d.nom+' (copie)';c.exemple=false;c.updated=Date.now();
    Object.values(c.lots).forEach(l=>l.offres.forEach(o=>o.id=uid()));state.dossiers.push(c);state.current=c.id;save();render();toast('Dossier dupliqué');return;}
  else if(a==='del'){pendingDelete=true;renderMain();return;}
  else if(a==='del-no'){pendingDelete=false;renderMain();return;}
  else if(a==='del-yes'){pendingDelete=false;state.dossiers=state.dossiers.filter(x=>x.id!==d.id);
    if(!state.dossiers.length){const n=blank();state.dossiers.push(n);}
    state.current=state.dossiers[0].id;save();render();toast('Dossier supprimé');return;}
  d.updated=Date.now(); save(); render();
  if(a==='add-contact'){const i=d.contacts.length-1;document.getElementById(`c${i}n`)?.focus();}
  if(a==='add-offre'){const o=d.lots[b.dataset.lot].offres.at(-1);document.getElementById(`o-${o.id}-f`)?.focus();}
  if(a==='add-produit'){const pr=d.lots[b.dataset.lot].produits.at(-1);document.getElementById(`p-${pr.id}-d`)?.focus();}
});
document.getElementById('list').addEventListener('click',e=>{
  const b=e.target.closest('.item'); if(!b) return; state.current=b.dataset.id; pendingDelete=false; save(); render();
});
document.getElementById('pick').addEventListener('change',e=>{state.current=e.target.value;pendingDelete=false;save();render();});
window.addEventListener('resize',()=>document.querySelectorAll('#main textarea').forEach(autosize));
/* installation (PWA) */
let deferredInstall=null; const bi=document.getElementById('btn-install');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;bi.hidden=false;});
bi.addEventListener('click',async()=>{if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice;}catch(e){}deferredInstall=null;bi.hidden=true;});
window.addEventListener('appinstalled',()=>{bi.hidden=true;toast('Etudotronic installée');});
document.getElementById('btn-new').addEventListener('click',()=>{
  const n=blank(); state.dossiers.push(n); state.current=n.id; state.tab='denom'; save(); render();
  const el=document.getElementById('f-nom'); if(el){el.focus();el.select();}
});
document.getElementById('btn-export').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify({app:'dossiers-tp',version:1,date:new Date().toISOString(),dossiers:state.dossiers},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`dossiers-tp_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);a.click();a.remove();toast('Export lancé');
});
document.getElementById('file-import').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);const list=Array.isArray(j)?j:j.dossiers;if(!Array.isArray(list))throw 0;
      const ids=new Set(state.dossiers.map(d=>d.id));let n=0;
      list.forEach(d=>{const m=normalize(Object.assign(blank(),d));if(ids.has(m.id))state.dossiers=state.dossiers.filter(x=>x.id!==m.id);state.dossiers.push(m);n++;});
      state.current=state.dossiers.at(-1).id;save();render();toast(`${n} dossier${n>1?'s':''} importé${n>1?'s':''}`);}
    catch(err){toast('Fichier non reconnu : attendu un export JSON de cette appli');}
    e.target.value='';};
  r.readAsText(f);
});

render();
})();
</script>

</body>
